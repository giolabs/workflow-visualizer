# Tag-driven releases.
#
#   scripts/release.sh 0.4.0-beta.2      # release PR: bump + CHANGELOG section
#   scripts/tag-release.sh 0.4.0-beta.2  # after the merge: tags v0.4.0-beta.2 on main
#
# Pushing a `v*` tag runs this in two jobs. `verify` runs with a read-only token and no
# persisted credentials: it checks the tag is a release tag reachable from `main`, that it
# matches plugin.json, validates and tests the plugin, and renders the CHANGELOG section into
# an artifact. `publish` runs no repository code: it only downloads that artifact and creates
# the GitHub release with a write token. A tag with a pre-release suffix (`-beta.1`, `-rc.2`)
# becomes a pre-release. Actions and the Claude Code CLI are pinned.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag is a release tag and matches plugin.json
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "not a release tag: $GITHUB_REF_NAME" >&2; exit 1; }
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8')).version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match plugin.json version $version" >&2
            exit 1
          fi

      - name: Tagged commit is reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME points at a commit not on main" >&2; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.323

      - name: Validate plugin
        run: claude plugin validate .

      - name: Run plugin tests
        run: claude plugin test .

      - name: Release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog-section.mjs "$version" > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "no CHANGELOG section for $version" >&2; exit 1; }
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          args=(--title "workflow-visualizer ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; not overwriting its notes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
